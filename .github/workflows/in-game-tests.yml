name: In-game integration tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: in-game-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  minecraft-in-game:
    name: Minecraft in-game tests (1.21.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"
      - name: Install headless graphics and input tools
        timeout-minutes: 4
        run: |
          set -euo pipefail
          packages=()
          for item in "xvfb:Xvfb" "xdotool:xdotool"; do
            package="${item%%:*}"
            executable="${item#*:}"
            if ! command -v "$executable" >/dev/null 2>&1; then packages+=("$package"); fi
          done
          for package in libgl1-mesa-dri libglx-mesa0 libxrandr2 libxinerama1 libxcursor1 libxi6 libxrender1 libxtst6 libxkbcommon0 libopenal1 libasound2t64; do
            if ! dpkg-query -W -f="${Status}" "$package" 2>/dev/null | grep -q "install ok installed"; then packages+=("$package"); fi
          done
          if (("${#packages[@]}" > 0)); then
            sudo env DEBIAN_FRONTEND=noninteractive timeout 180s apt-get install -y --no-install-recommends -o DPkg::Lock::Timeout=30 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 "${packages[@]}"
          fi
          for executable in Xvfb xdotool javac java; do command -v "$executable"; done
          javac scripts/ci/ScreenCapture.java
      - name: Cache Minecraft client, libraries and assets
        uses: actions/cache@v4
        with:
          path: ~/.cache/vantaloader/minecraft/1.21.11
          key: minecraft-1.21.11-linux-assets-v1
      - name: Build loader agent and in-game test mods
        run: |
          gradle --no-daemon clean build
          gradle --no-daemon -p examples/hello-mod clean build
          gradle --no-daemon -p examples/auto-sprint clean build
          gradle --no-daemon -p examples/runtime-probe clean build
      - name: Run Minecraft in-game test suite
        run: |
          XCURSOR_THEME=DMZ-White XCURSOR_SIZE=24 xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" bash scripts/ci/run_visual_smoke.sh --agent build/agent/VantaLoader-agent.jar --mod examples/hello-mod/build/libs/vantaloader-hello-mod-1.0.0.jar --mod examples/auto-sprint/build/libs/vantaloader-auto-sprint-1.0.0.jar --mod examples/runtime-probe/build/libs/vantaloader-runtime-probe-1.0.0.jar --output build/visual-smoke --timeout 240
      - name: Upload in-game proof (screenshots, logs and machine-readable results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vantaloader-in-game-proof-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build/visual-smoke/game-test-evidence.json
            build/visual-smoke/*.png
            build/visual-smoke/launch-command.txt
            build/visual-smoke/instance/logs/visual-smoke.log
          if-no-files-found: warn
          retention-days: 30
