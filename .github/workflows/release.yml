name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: vantaloader-release
  cancel-in-progress: false

jobs:
  package:
    name: Build and publish VantaLoader agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"
      - name: Resolve human-readable release identity
        id: release_meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
            name="VantaLoader $version"
          else
            short_sha="${GITHUB_SHA:0:7}"
            date_utc="$(date -u +'%Y.%m.%d')"
            version="0.1.0-nightly.${date_utc//./}.$short_sha"
            tag="nightly-0.1.0-${date_utc//./}-$short_sha"
            name="VantaLoader 0.1.0 Nightly - $date_utc ($short_sha)"
          fi
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          echo "release_name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: gradle --no-daemon clean build -PvantaVersion="${{ steps.release_meta.outputs.version }}"
      - name: Generate SHA-256 checksum
        run: |
          cd build/agent
          sha256sum VantaLoader-agent.jar > VantaLoader-agent.jar.sha256
          sha256sum VantaLoader-api.jar > VantaLoader-api.jar.sha256
      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          generate_release_notes: true
          prerelease: ${{ github.ref == 'refs/heads/main' || contains(github.ref_name, '-') }}
          make_latest: false
          files: |
            build/agent/VantaLoader-agent.jar
            build/agent/VantaLoader-agent.jar.sha256
            build/agent/VantaLoader-api.jar
            build/agent/VantaLoader-api.jar.sha256
