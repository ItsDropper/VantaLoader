name: Build and unit tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"
      - name: Build and test
        run: gradle --no-daemon clean build
      - name: Build example mods
        run: |
          gradle --no-daemon -p examples/hello-mod clean build
          gradle --no-daemon -p examples/auto-sprint clean build
          gradle --no-daemon -p examples/runtime-probe clean build
          gradle --no-daemon -p examples/vma-showcase clean build
          gradle --no-daemon -p gradle-plugin clean build
